<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="parchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F0DA"/>
      <stop offset="50%" stop-color="#F0E7C9"/>
      <stop offset="100%" stop-color="#E6DAB4"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#parchGrad)"/>
  <rect width="400" height="400" fill="#8B7355" filter="url(#grain)"/>
  <g fill="none" stroke="#c9a876" stroke-width="1" opacity="0.25">
    <ellipse cx="70" cy="90" rx="40" ry="18"/>
    <ellipse cx="320" cy="260" rx="55" ry="22"/>
    <ellipse cx="200" cy="350" rx="35" ry="14"/>
  </g>
</svg>
